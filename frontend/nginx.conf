# Phase 14 MISSING item M5 (SPA fallback) — frontend/src/App.tsx uses
# react-router-dom's `BrowserRouter` (history-API routing, confirmed via
# frontend/src/routes/AppRoutes.tsx: real paths like /, /inbox, /sessions,
# /blast, /settings, each rendered client-side, not as separate static
# files). Stock nginx (the base default.conf this image shipped before
# this file existed) has no fallback: a direct browser navigation or
# refresh on any of those paths 404s, because no such file exists on
# disk — only `index.html` + `/assets/*` do (`npm run build`'s output).
#
# `try_files $uri $uri/ /index.html;` fixes exactly that: nginx first
# tries the request path as a real file (serves JS/CSS/image assets
# normally), then as a directory, and only falls back to `index.html`
# (letting react-router take over client-side) when neither exists —
# so this never intercepts a request for a real static asset, only
# ever a client-side route with no matching file.
#
# This is unrelated to, and does not change, infrastructure/tencent's
# `reverse-proxy` (Phase 14 Blocker B3) — that proxy's own `location /`
# just forwards whatever path it received to this container over the
# Docker network (http://frontend:80); it never serves files itself,
# so it needs no fallback of its own. This file is what actually
# serves the SPA's static files, so this is where the fallback belongs.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Built assets (`npm run build`'s dist/assets/*) must either serve as
    # themselves or return a REAL 404 — never silently fall back to
    # index.html. Without this separate block, a genuinely missing/renamed
    # asset (e.g. after a deploy whose old cached index.html still
    # references a since-removed hashed filename) would 200 with the SPA's
    # HTML instead of a clear 404, which the browser would then fail to
    # parse as JS/CSS with a confusing error instead of a clean network
    # failure. Confirmed this gap existed with only a single `location /`
    # block, before this one was added.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
